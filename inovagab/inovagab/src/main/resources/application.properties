spring.application.name=inovagab
server.port=8080

# Conexao com o Cluster MongoDB Atlas
spring.data.mongodb.uri=${MONGODB_URI:mongodb+srv://admin_inovagab:Abc123@cluster0.xxxxxxx.mongodb.net/inovagab_db?retryWrites=true&w=majority}

# Chave secreta usada para assinar/validar os tokens JWT
api.security.token.secret=${JWT_SECRET:inovagab-secret-key-change-in-production}

# Chave da API do Google Gemini (integracao de IA)
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent}
